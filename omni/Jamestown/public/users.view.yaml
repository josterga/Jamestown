# Reference this view as users
schema: public

dimensions:
  first_name: {}
  last_name: {}
  email: {}
  age: {}
  country: {}
  zip: {}
  latitude: {}
  longitude: {}
  gender: {}
  created_at: {}
  traffic_source: {}

  state:
    suggest_from_field: users.state
    suggest_from_topic: users

  city_new:
    sql: city
    aliases: [ city ]

  id:
    format: ID
    primary_key: true

  trademark_name:
    sql: CONCAT(${users.first_name}, '™', ${users.last_name})

  omni_user_email:
    sql: "{{omni_attributes.omni_user_email}}"

measures:
  count:
    aggregate_type: count
    ai_context: context
