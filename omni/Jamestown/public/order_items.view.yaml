# Reference this view as order_items
schema: public

# __omni_extension_placeholder__
dimensions:
  sale_price: {}
  status: {}
  created_at: {}
  returned_at: {}
  shipped_at: {}

  delivered_at:
    sql: delivered_at
    label: Delivered At Copy 0

  id:
    format: ID
    group_label: a
    primary_key: true

  order_id:
    format: ID
    links:
      - url: ${order_items.user_link}
        label: LINK
    group_label: a > b

  user_link:
    sql: concat('https://www.', ${order_items.attribute}, '.omni.co')

  inventory_item_id:
    format: ID
    links:
      - url: https://www.${order_items.attribute}.omni.co
        label: LINK

  attribute:
    sql: "{{omni_attributes.region}}"

measures:
  count:
    aggregate_type: count

  count_copy:
    label: Order Items Count Copy
    format: NUMBER_0
    aggregate_type: count
