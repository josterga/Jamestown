# Reference this view as order_items
schema: public

dimensions:
  sale_price: {}
  status: {}
  created_at: {}
  returned_at: {}
  shipped_at: {}
  delivered_at: {}
  region: {}

  id:
    format: ID
    primary_key: true

  order_id:
    format: ID

  user_id:
    format: ID

  inventory_item_id:
    format: ID

measures:
  count:
    aggregate_type: count

  count_copy:
    label: Order Items Count Copy
    format: NUMBER_0
    aggregate_type: count
