# Reference this view as order_items
schema: public

dimensions:
  sale_price: {}
  status: {}
  created_at: {}
  returned_at: {}
  shipped_at: {}
  delivered_at: {}

  status_groups:
    sql: ${order_items.status}
    groups:
      - filter:
          is: Cancelled
        name: Cancelled
      - filter:
          is: Returned
        name: Returned
    else: Other
    label: Status Groups

  id:
    format: ID
    primary_key: true

  order_id:
    format: ID

  user_id:
    format: ID

  inventory_item_id:
    format: ID

  region:
    sql: "{{omni_attributes.region}}"
    label: Branchb
    required_access_grants: [ embed_grant ]

measures:
  count:
    aggregate_type: count

  count_copy:
    label: Order Items Count Copy
    format: NUMBER_0
    aggregate_type: count
