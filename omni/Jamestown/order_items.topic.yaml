# this is the order_items topic
joins:
  users: {}
  inventory_items:
    products:
      distribution_centers: {}

ai_context: output must be all lowercase

sample_queries:
  POP Sample Query:
    query:
      fields: [ omni_period_pivot, order_items.status, order_items.count, calc_1 ]
      base_view: order_items
      calculations:
        calc_1:
          sql: OMNI_PIVOT_OFFSET(${order_items.count}, 0, 0) OMNI_FX_PLUS 100
          label: Calculation
      filters:
        order_items.created_at:
          time_for_duration: [ 3 days ago, 3 days ]
      limit: 1000
      fill_fields: [ omni_period_pivot, order_items.status ]
      sorts:
        - field: order_items.status
      topic: order_items
      period_over_period:
        - field_name: order_items.created_at
          time_unit_name: WEEK
          periods_ago: 1
      pivots: [ omni_period_pivot ]
      column_limit: 50
    description: POP Sample Query
  SUPPORT QUERY TWELVE:
    query:
      fields: [ omni_period_pivot, order_items.status, order_items.count ]
      base_view: order_items
      filters:
        order_items.created_at:
          time_for_duration: [ 1 complete weeks ago, 1 weeks ]
      limit: 1000
      sorts:
        - field: order_items.status
      topic: order_items
      period_over_period:
        - field_name: order_items.created_at
          time_unit_name: WEEK
          periods_ago: 1
      pivots: [ omni_period_pivot ]
      column_limit: 50
    description: SUPPORT QUERY TWELVE
    vis_config:
      spec:
        x:
          field:
            name: omni_period_pivot
        y:
          color:
            _stack: stack
        y2:
          color:
            _stack: stack
        mark:
          type: bar
        color:
          field:
            name: order_items.status
          _stack: stack
        series:
          - field:
              name: order_items.count
            yAxis: y
        tooltip:
          - field:
              name: omni_period_pivot
          - field:
              name: order_items.status
          - field:
              name: order_items.count
        version: 0
        behaviors:
          stackMultiMark: true
        configType: cartesian
        _dependentAxis: y
      fields: [ omni_period_pivot, order_items.status, order_items.count ]
      version: 0
      visType: basic
  10 to the 4:
    query:
      fields: [ order_items.status, order_items.count, calc_1 ]
      base_view: order_items
      calculations:
        calc_1:
          sql: ${order_items.count} OMNI_FX_MULTIPLY POWER(10, 4)
          label: Calculation
      limit: 1000
      sorts:
        - field: order_items.count
          desc: true
      topic: order_items
    description: 10 to the 4
